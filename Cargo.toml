[package]
name = "crash_utilities"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
# While the mod needs horizon-rust/horizon#19041, #19048 and #19052, it builds inside a Horizon
# checkout that has them, from `.local/dev-mods/crash_utilities` (see README.md); once a Nightly
# has them, this becomes the pinned SDK path `cargo horizon-mod` writes.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }
# `/cu entities remove regex`: Java's `String.matches`.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

# A mod is its own project, not a member of the game's workspace.
[workspace]
