[package]
name = "crash_utilities"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
# While `cu callItemClear` and the other camelCase words need horizon-rust/horizon#19039, the
# mod builds inside a Horizon checkout that has it, from `.local/dev-mods/crash_utilities` (see
# README.md); once a Nightly has it, this becomes the pinned SDK path `cargo horizon-mod` writes.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }
# `/cu entities remove regex`: Java's `String.matches`.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }

# A mod is its own project, not a member of the game's workspace.
[workspace]
